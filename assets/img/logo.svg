<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" role="img" aria-label="BKHD circuit-board monogram">
  <defs>
    <linearGradient id="bkhd" x1="4" y1="4" x2="44" y2="44" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset=".55" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#7c9cff"/>
    </linearGradient>
  </defs>
  <rect x="1" y="1" width="46" height="46" rx="12" fill="url(#bkhd)"/>
  <!-- PCB traces + pads -->
  <g stroke="#05141d" stroke-width="1.5" stroke-linecap="round" fill="none" opacity=".45">
    <path d="M10 16h5v-6"/>
    <path d="M38 16h-5v-6"/>
    <path d="M10 32h5v6"/>
    <path d="M38 32h-5v6"/>
    <path d="M6 24h6M42 24h-6M24 6v6M24 42v-6"/>
  </g>
  <g fill="#05141d" opacity=".45">
    <circle cx="15" cy="10" r="1.6"/><circle cx="33" cy="10" r="1.6"/>
    <circle cx="15" cy="38" r="1.6"/><circle cx="33" cy="38" r="1.6"/>
    <circle cx="6" cy="24" r="1.6"/><circle cx="42" cy="24" r="1.6"/>
    <circle cx="24" cy="6" r="1.6"/><circle cx="24" cy="42" r="1.6"/>
  </g>
  <!-- central chip -->
  <rect x="14" y="14" width="20" height="20" rx="4" fill="#0b0f14"/>
  <text x="24" y="30" text-anchor="middle"
        font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif"
        font-size="11" font-weight="800" letter-spacing="-.5" fill="url(#bkhd)">BK</text>
</svg>
